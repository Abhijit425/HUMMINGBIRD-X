name: Build Android (APK + AAB)

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compiles all runtime C# against Unity reference assemblies with the .NET SDK.
  # Needs no Unity license, so it catches script errors in about a minute.
  compile-check:
    runs-on: ubuntu-latest
    outputs:
      has_license: ${{ steps.lic.outputs.has_license }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile runtime scripts
        run: bash ci/compile-check.sh
      - name: Check Unity license secrets
        id: lic
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "has_license=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_license=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Unity license secrets are not set yet, so the APK/AAB build is skipped. See README > Setup."
          fi

  build:
    needs: compile-check
    if: needs.compile-check.outputs.has_license == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      # 1) APK for installing on the tablet
      - name: Build APK with Unity 6
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.8f1
          targetPlatform: Android
          buildName: HummingbirdX
          buildMethod: HummingbirdX.EditorTools.BuildScript.BuildAndroid
          androidExportType: androidPackage
          allowDirtyBuild: true
          versioning: Custom
          version: 0.1.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
          androidKeystoreName: user.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      # 2) App Bundle for Google Play (reuses the imported Library, so it's much faster)
      - name: Build AAB with Unity 6
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.8f1
          targetPlatform: Android
          buildName: HummingbirdX
          buildMethod: HummingbirdX.EditorTools.BuildScript.BuildAndroid
          androidExportType: androidAppBundle
          allowDirtyBuild: true
          versioning: Custom
          version: 0.1.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
          androidKeystoreName: user.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: List outputs
        if: always()
        run: ls -la build/Android || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HummingbirdX-Android
          path: build/Android
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HUMMINGBIRD X build ${{ github.run_number }}
          prerelease: true
          body: |
            Automated build from commit ${{ github.sha }}.
            Install HummingbirdX.apk on your tablet. HummingbirdX.aab is for Google Play.
          files: |
            build/Android/**/*.apk
            build/Android/**/*.aab
